[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgm-side-b"
version = "0.1.0"
description = "Local-first Bangumi archive tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MyKr-YSteinsK" }]
dependencies = ["httpx>=0.27,<1", "Jinja2>=3.1,<4", "Pillow>=10,<12"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "playwright>=1.50,<2"]

[project.scripts]
bgmb = "bgm_side_b.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
