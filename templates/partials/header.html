{% from "partials/icons.html" import archive_mark %}
<header class="site-header" aria-label="资料库页眉">
  <div class="site-header__rule">
    <p>Bangumi Side B by MyKr</p>
    <p>{{ header_code }}</p>
  </div>
  <div class="site-header__brand">
    <a class="brand" href="{{ home_href }}"{% if pwa_enabled %} data-pwa-home{% endif %} aria-label="前往资料库首页">
      {{ archive_mark() }}
      <span class="brand__name">Bangumi Side B</span>
      <span class="brand__side">资料库</span>
    </a>
    <div class="site-header__utility"><p class="site-header__profile">{{ profile_label }}</p>{% if pwa_enabled %}<nav aria-label="资料库工具"><a href="{{ settings_href }}">设置</a><a href="{{ updates_href }}">更新日志</a></nav>{% endif %}</div>
  </div>
</header>
